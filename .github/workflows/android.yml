
name: Build Goa Vibes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -q GoaVibesAndroid_Starter.zip -d extracted

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/GoaVibesAndroid/app/build.gradle.kts")
          s = p.read_text()
          needle = '    buildFeatures { compose = true }'
          replacement = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures { compose = true }'''
          if needle not in s:
              raise SystemExit("Could not find buildFeatures line")
          p.write_text(s.replace(needle, replacement, 1))
          PY

      - name: Build APK
        working-directory: extracted/GoaVibesAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goa-Vibes-APK
          path: extracted/GoaVibesAndroid/app/build/outputs/apk/debug/app-debug.apk
